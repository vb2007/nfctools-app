# Gradle itself still needs a JVM on JAVA_HOME/PATH to bootstrap (any JDK 17+ works for
# this); the actual project JDK is pinned portably via `kotlin { jvmToolchain(21) }` in
# app/build.gradle.kts instead of a hardcoded path here, so this file works unmodified
# across machines (e.g. Arch dev box vs. Debian CI runner) with different JDK install layouts.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9's built-in Kotlin support and new DSL shape don't yet have clear, documented
# interop with the Compose compiler and kotlinx-serialization Gradle plugins; opt out of
# both and use the classic, well-documented DSL/plugin wiring until that story matures.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
